name: Fetch energy data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - main

jobs:
  fetch_energy:
    name: Fetch and pre-process energy data
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.IIS_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        run: |
          pipx install uv

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run fetch script
        run: |
          uv run python src/data/fetch_energy_data.py

      - name: Run pre-process script
        run: |
          uv run python src/data/preprocess_energy_data.py

      - name: Commit data changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add data

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update energy data"
            git push origin main
          fi