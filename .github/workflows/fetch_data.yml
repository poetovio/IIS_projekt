name: Fetch energy data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - main

jobs:
  fetch_energy:
    name: Fetch and pre-process energy data
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.IIS_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        run: |
          pipx install uv

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Pull data from DagsHub
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_SECRET_KEY }}
        run: |
          uv run dvc pull

      - name: Test Obsyd connection
        run: |
          echo "Testing DNS resolution..."
          getent hosts obsyd.dev

          echo "Testing IPv4 connection..."
          curl -4 -v --connect-timeout 20 https://obsyd.dev/api/v1/zones

          echo "Testing HTTPS connection..."
          curl -I -4 --connect-timeout 20 https://obsyd.dev/api/v1/zones

      - name: Run fetch script
        run: |
          uv run python src/data/fetch_energy_data.py

      - name: Run pre-process script
        run: |
          uv run python src/data/preprocess_energy_data.py

      - name: Push data to DagsHub
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_SECRET_KEY }}
        run: |
          uv run dvc add data
          git add data.dvc .gitignore
          uv run dvc push

      - name: Commit data changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add data.dvc .gitignore

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update energy data"
            git push origin main
          fi