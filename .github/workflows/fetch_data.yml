name: Fetch energy data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - main

jobs:
  fetch_energy:
    name: Fetch and pre-process energy data
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.IIS_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        run: |
          pipx install uv

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: DVC setup remote
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_SECRET_KEY }}
        run: |
          uv run dvc remote modify origin --local access_key_id "$AWS_ACCESS_KEY_ID"
          uv run dvc remote modify origin --local secret_access_key "$AWS_SECRET_ACCESS_KEY"

      - name: Run DVC pipeline
        run: |
          uv run dvc pull
          uv run dvc status
          uv run dvc repro

      - name: Deploy Great Expectations report
        uses: netlify/actions/cli@master
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        with:
          args: deploy --dir=gx/uncommitted/data_docs/local_site --prod

      - name: Push data to DagsHub
        run: |
          uv run dvc push

      - name: Commit data changes
        run: |
          git add dvc.lock

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update dvc.lock on $(date)"
          fi

      - name: Push changes
        env:
          GH_TOKEN: ${{ secrets.IIS_TOKEN }}
        run: |
          git push https://x-access-token:${GH_TOKEN}@github.com/poetovio/IIS_projekt.git main