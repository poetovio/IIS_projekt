stages:
  fetch:
    cmd: uv run python src/data/fetch_energy_data.py
    deps:
      - src/data/fetch_energy_data.py
    params:
      - fetch.series
      - fetch.start_date
    outs:
      - data/raw/electricity/prices:
          persist: true
    always_changed: true

  preprocess:
    cmd: uv run python src/data/preprocess_energy_data.py
    deps:
      - src/data/preprocess_energy_data.py
      - data/raw/electricity/prices
    params:
      - preprocess.input_directory
      - preprocess.output_directory
    outs:
      - data/processed/electricity/prices:
          persist: true

  validate:
    cmd: uv run python src/data/validate_energy_data.py
    deps:
      - data/processed/electricity/prices
      - src/data/validate_energy_data.py
      - gx/expectations/energy_prices_suite.json
      - gx/great_expectations.yml
      - gx/checkpoints/energy_prices_checkpoint.yml

  test_data:
    cmd: uv run python src/tests/test_data.py
    deps:
      - data/processed/electricity/prices
      - src/tests/test_data.py
    outs:
      - data/reference/electricity/prices:
          persist: true

  train:
    cmd: uv run python src/train.py
    deps:
      - src/train.py
      - data/processed/electricity/prices
      - data/reference/electricity/prices
    params:
      - train.train_ratio
      - train.random_state
      - train.window_size
      - train.epochs
      - train.batch_size
    outs:
      - models/regression:
          persist: true

  train_classification:
    cmd: uv run python src/train_classifier.py
    deps:
      - src/train_classifier.py
      - data/processed/electricity/prices
    params:
      - classification.test_ratio
      - classification.validation_ratio
      - classification.random_state
      - classification.epochs
      - classification.batch_size
      - classification.learning_rate
      - classification.patience
      - classification.low_quantile
      - classification.high_quantile
    outs:
      - models/classification:
          persist: true