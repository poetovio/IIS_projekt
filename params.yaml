fetch:
  series: "price.dayahead"
  start_date: "2024-01-01"

preprocess:
  input_directory: "data/raw/electricity/prices"
  output_directory: "data/processed/electricity/prices"

train:
  window_size: 24
  train_ratio: 0.8
  epochs: 50
  batch_size: 64
  random_state: 42

classification:
  test_ratio: 0.2
  validation_ratio: 0.1
  random_state: 42
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  patience: 5
  low_quantile: 0.3333333333
  high_quantile: 0.6666666667